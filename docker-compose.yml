# =========================================================
# Ambiente LOCAL de teste - PetHub
# Challenge FIAP Sprint 3 - DevOps Tools & Cloud Computing
#
# Sobe as DUAS imagens construidas pelos Dockerfiles do projeto:
#   - oracle-db  -> ./database/Dockerfile
#   - app        -> ./Dockerfile
#
# Em nuvem estes mesmos dois artefatos viram dois ACIs separados.
# =========================================================
services:

  oracle-db:
    build:
      context: ./database
    image: ${IMAGE_PREFIX:-rm566234}-pethub-oracle:${IMAGE_TAG:-v1}
    container_name: pethub-oracle
    environment:
      ORACLE_PASSWORD: ${ORACLE_PWD}
      APP_USER: ${APP_DB_USER}
      APP_USER_PASSWORD: ${APP_DB_PASSWORD}
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          echo "SELECT COUNT(*) FROM user_tables WHERE table_name='TB_PET';"
          | sqlplus -s -l "$${APP_USER}/$${APP_USER_PASSWORD}@//localhost:1521/XEPDB1"
          | grep -qE "^[[:space:]]*1[[:space:]]*$$" || exit 1
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 120s

  app:
    build:
      context: .
    image: ${IMAGE_PREFIX:-rm566234}-pethub-app:${IMAGE_TAG:-v1}
    container_name: pethub-app
    depends_on:
      oracle-db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:oracle:thin:@//oracle-db:1521/XEPDB1
      DB_USER: ${APP_DB_USER}
      DB_PASSWORD: ${APP_DB_PASSWORD}
      DB_DDL_AUTO: ${SPRING_DDL_AUTO:-validate}
      SHOW_SQL: ${SPRING_SHOW_SQL:-true}
      DB_POOL_MAX: ${SPRING_POOL_MAX:-10}
      DB_POOL_MIN: ${SPRING_POOL_MIN:-2}
      JWT_SECRET: ${JWT_SECRET}
    restart: unless-stopped

volumes:
  oracle-data:
