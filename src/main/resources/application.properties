spring.application.name=pethub

# =====================================================================
# Datasource - tudo vem de variavel de ambiente. Sem segredo no codigo.
# =====================================================================
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//oracle-db:1521/XEPDB1}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:validate}
spring.jpa.show-sql=${SHOW_SQL:true}

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# HikariCP
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# Seguranca. O segredo NUNCA vai versionado: vem da variavel de ambiente JWT_SECRET.
pethub.jwt.segredo=${JWT_SECRET}
pethub.jwt.validade=PT8H
